name: Fix UI overflow and footer

on:
  push:
    paths:
      - '.github/workflows/fix-ui-overflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted UI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Contact data: use the direct programme contact consistently.
          s=s.replace('"telephone": "+436776165592"', '"telephone": "+436706539011"')
          s=s.replace('"email": "marketing@kozpontiszovetseg.at"', '"email": "hupczik@gmail.com"')
          s=s.replace('Kérdés esetén a +43 677 616 555 92-es telefonszámot lehet hívni napközben 9 és 16 óra között, vagy írni a marketing@kozpontiszovetseg.at e-mail címre.', 'Kérdés esetén közvetlenül Hupczik Andreát lehet keresni a +43 670 653 9011-es telefonszámon vagy a hupczik@gmail.com e-mail címen.')

          old_bmi='''<div class="location-row"><div class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="#9A6B3F" stroke-width="1.4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="#9A6B3F" stroke-width="1.4"/></svg></div><div><div class="label">Social media és honlap</div><div class="value">Bánhalmi Norbert<small>e-mail: marketing@kozpontiszovetseg.at · tel.: +43 677 616 555 92</small></div></div></div>'''
          new_bmi='''<div class="location-row"><div class="icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="#9A6B3F" stroke-width="1.4"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6" stroke="#9A6B3F" stroke-width="1.4"/></svg></div><div><div class="label">Kapcsolat</div><div class="value">Bécsi Magyar Iskola<small>e-mail: office@magyariskola.at</small></div></div></div>'''
          s=s.replace(old_bmi,new_bmi)

          old_footer='''<p class="footer-note">A <a href="https://www.taltosdob.hu" target="_blank" rel="noopener">www.taltosdob.hu</a> bécsi csapata és a <a href="https://www.magyariskola.at" target="_blank" rel="noopener">Bécsi Magyar Iskola</a> közös programja <span class="footer-beat b1"></span><br>Szakmai vezető: Hupczik Andrea · Helyszín: Schwedenplatz 2. / Laurenzerberg 5., 1. em. 8–9. ajtó, 1010 Bécs <span class="footer-beat b2"></span><br>Kapcsolat: <a href="tel:+436776165592">+43 677 616 555 92</a> (napközben 9–16h) · <a href="mailto:marketing@kozpontiszovetseg.at">marketing@kozpontiszovetseg.at</a><br><a href="adatvedelem.html">Adatvédelmi tájékoztató</a> · © Világfa Sárkányai Gyermek Dobcsapat <span class="footer-beat b3"></span></p>'''
          new_footer='''<p class="footer-note">A <a href="https://www.taltosdob.hu" target="_blank" rel="noopener">www.taltosdob.hu</a> bécsi csapata és a <a href="https://www.magyariskola.at" target="_blank" rel="noopener">Bécsi Magyar Iskola</a> közös programja.<br>Szakmai vezető: Hupczik Andrea · <a href="tel:+436706539011">+43 670 653 9011</a> · <a href="mailto:hupczik@gmail.com">hupczik@gmail.com</a><br>Helyszín: Schwedenplatz 2. / Laurenzerberg 5., 1010 Bécs<br><a href="adatvedelem.html">Adatvédelmi tájékoztató</a> · © Világfa Sárkányai Gyermek Dobcsapat</p>'''
          s=s.replace(old_footer,new_footer)

          fix_css=r'''

/* ========== 2026-08-20 targeted layout fixes ========== */
.info-grid{
  align-items:start!important;
  gap:clamp(2.2rem,5vw,4.5rem)!important;
}
.info-grid>div{min-width:0!important}
.info-block{
  padding:clamp(1.55rem,2.8vw,2.25rem)!important;
  margin:0 0 1rem!important;
  border-radius:22px!important;
  background:rgba(255,255,255,.72)!important;
  border:1px solid rgba(41,47,38,.10)!important;
}
.info-block h3{margin-bottom:1.25rem!important;line-height:1.12!important}
.info-block p.note{margin-top:1.15rem!important;color:#51554B!important;line-height:1.7!important}
.tag-list{gap:.6rem!important}
.tag{background:rgba(255,255,255,.56)!important;border-color:rgba(91,61,39,.22)!important;padding:.5rem .95rem!important;line-height:1.2!important}
.format-row{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:.85rem!important;margin-top:1.25rem!important}
.format-pill{min-width:0!important;padding:1.15rem 1.25rem!important;border-radius:16px!important}
.format-pill .value{line-height:1.15!important}
.price-card{align-self:start!important;padding:clamp(2rem,3vw,2.7rem)!important}
.location-grid{gap:clamp(1.5rem,3vw,2.6rem)!important;align-items:stretch!important}
.location-card{
  min-width:0!important;
  height:100%!important;
  padding:clamp(1.8rem,3vw,2.6rem)!important;
  overflow:visible!important;
}
.location-card h3{margin-bottom:1.3rem!important;line-height:1.15!important}
.location-row{gap:1rem!important;padding:1rem 0!important;min-width:0!important}
.location-row>div:last-child{min-width:0!important;flex:1 1 auto!important}
.location-row .value,.location-row .value small{overflow-wrap:anywhere!important;word-break:normal!important}
.location-row .value small{margin-top:.28rem!important;line-height:1.55!important;color:#68695F!important}
.location-card a{
  color:#765A22!important;
  text-decoration:underline!important;
  text-decoration-thickness:1px!important;
  text-decoration-color:rgba(118,90,34,.35)!important;
  text-underline-offset:3px!important;
}
.location-card a:hover{color:#4D3913!important;text-decoration-color:currentColor!important}
.footer-note{
  max-width:720px!important;
  margin:0 auto!important;
  padding:0 1rem!important;
  font-size:.84rem!important;
  line-height:1.85!important;
  color:rgba(243,239,229,.68)!important;
  letter-spacing:0!important;
}
.footer-note a{color:#E5C980!important;text-decoration:none!important;border-bottom:1px solid rgba(229,201,128,.28)!important}
@media(max-width:880px){
  .info-grid{grid-template-columns:1fr!important}
  .location-grid{grid-template-columns:1fr!important}
}
@media(max-width:620px){
  .info-block,.location-card,.price-card{border-radius:18px!important;padding:1.35rem!important}
  .format-row{grid-template-columns:1fr!important}
  .tag{font-size:.82rem!important}
  .footer-note{font-size:.8rem!important;line-height:1.75!important}
}
'''
          if '2026-08-20 targeted layout fixes' not in s:
              s=s.replace('</style>',fix_css+'\n</style>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix info cards contact layout and footer readability"
          git push origin HEAD:main
