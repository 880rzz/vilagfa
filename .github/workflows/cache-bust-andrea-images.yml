name: Cache bust Andrea images
on:
  push:
    paths:
      - '.github/workflows/cache-bust-andrea-images.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust image cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          repl={
            'images/andrea-stage-2026.jpg':'images/andrea-stage-2026.jpg?v=20260829-2',
            'images/andrea-family-2026.jpg':'images/andrea-family-2026.jpg?v=20260829-2',
            'images/andrea-stage-2-2026.jpg':'images/andrea-stage-2-2026.jpg?v=20260829-2',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust cache for repaired Andrea photos' || exit 0
          git push
