name: Fix Andrea images

on:
  push:
    paths:
      - '.github/workflows/fix-andrea-images.yml'

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode photos and update page
        shell: bash
        run: |
          set -euo pipefail
          base64 -d images/stage-source.b64 > images/andrea-stage-2026.jpg
          base64 -d images/family-source.b64 > images/andrea-family-2026.jpg
          base64 -d images/stage2-source.b64 > images/andrea-stage-2-2026.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = '<section class="section learn"><div class="wrap"><div class="section-head">'
          replacement = '<section class="section learn"><div class="wrap"><div class="media" style="max-width:720px;margin:0 auto 42px"><img src="images/andrea-stage-2-2026.jpg" alt="A Regélő Fehér Táltos Dobcsapat színpadi fellépése"></div><div class="section-head">'
          if needle in s and 'images/andrea-stage-2-2026.jpg' not in s:
              s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f \
            images/stage-source.b64 \
            images/family-source.b64 \
            images/stage2-source.b64 \
            images/andrea-stage-2026.jpg.tmp \
            images/stage-repair.b64.txt \
            images/stage-repair-note.txt \
            images/image-repair-status.txt \
            images/repair-progress.txt \
            images/repair-readme.txt \
            images/andrea-stage-2026-fixed.b64.txt \
            images/test-placeholder.txt
          rm -f .github/workflows/fix-andrea-images.yml
      - name: Commit repaired photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix Andrea photos and add unused program image"
          git push
