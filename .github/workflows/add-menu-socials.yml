name: Add social links to navigation menu
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-menu-socials.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Facebook and Spotify to dropdown menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css_old='.nav-menu a:hover{background:rgba(255,255,255,.06)}.nav-menu .nav-cta{margin-top:6px;background:var(--gold);color:var(--forest);font-weight:600;text-align:center}'
          css_new='.nav-menu a:hover{background:rgba(255,255,255,.06)}.nav-socials{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(227,199,124,.16)}.nav-socials a{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid rgba(227,199,124,.26);border-radius:12px;color:var(--gold-hi)}.nav-socials a:hover{background:rgba(255,255,255,.06);border-color:rgba(227,199,124,.55)}.nav-socials svg{width:19px;height:19px;fill:currentColor}.nav-menu .nav-cta{margin-top:8px;background:var(--gold);color:var(--forest);font-weight:600;text-align:center}'
          if css_old not in s:
              raise SystemExit('Expected nav CSS not found')
          s=s.replace(css_old,css_new)

          old='<a href="#info">Részvétel</a><a class="nav-cta" href="jelentkezes.html">Jelentkezés</a></div></nav>'
          new='''<a href="#info">Részvétel</a><div class="nav-socials" aria-label="Közösségi oldalak"><a href="https://www.facebook.com/taltosdob" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 22v-9h3l.45-3.5H13.6V7.27c0-1.01.28-1.7 1.74-1.7H17.2V2.44c-.32-.04-1.42-.14-2.7-.14-2.67 0-4.5 1.63-4.5 4.63V9.5H7v3.5h3V22h3.6z"/></svg></a><a href="https://open.spotify.com/artist/6OJS2Y2KntijVTQWhIv0bo" target="_blank" rel="noopener" aria-label="Spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.58 14.42a.62.62 0 0 1-.85.2c-2.34-1.43-5.28-1.75-8.74-.96a.62.62 0 1 1-.28-1.2c3.79-.87 7.04-.5 9.67 1.1.29.18.38.56.2.86zm1.21-2.7a.78.78 0 0 1-1.07.26c-2.68-1.65-6.77-2.13-9.94-1.16a.78.78 0 1 1-.46-1.49c3.63-1.11 8.14-.58 11.21 1.31.37.23.49.71.26 1.08zm.1-2.81C14.67 9 9.36 8.82 6.3 9.75a.94.94 0 1 1-.54-1.79c3.51-1.06 9.38-.85 13.09 1.35a.94.94 0 0 1-.96 1.6z"/></svg></a></div><a class="nav-cta" href="jelentkezes.html">Jelentkezés</a></div></nav>'''
          if old not in s:
              raise SystemExit('Expected nav markup not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Facebook and Spotify to dropdown menu"
          git push