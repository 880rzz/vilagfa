name: Fix first session wording
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-first-session-copy.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify regular Saturday schedule and Sunday first session
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'Expected text not found: {label}')
              return s.replace(old, new)

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Havi alkalmak 16:00-kor, népi ritmusokkal, mondákkal, mozgással és kézművességgel.', 'Havi alkalmak, jellemzően szombatonként 16:00-kor; az első bemutató alkalom kivételesen 2026. szeptember 27-én, vasárnap lesz.')
          s=s.replace('Havi alkalmak 16:00-kor.</meta>', 'Havi alkalmak, jellemzően szombatonként 16:00-kor; az első alkalom 2026. szeptember 27-én, vasárnap lesz.</meta>')
          s=s.replace('Havi egy alkalommal, szombatonként 16:00-tól találkozunk.', 'A tanév során havi egy alkalommal, jellemzően szombatonként 16:00-tól találkozunk. Az első, bemutató alkalom kivételesen 2026. szeptember 27-én, vasárnap lesz.')
          s=s.replace('<div class="value">Szombat 16:00-tól</div>', '<div class="value">Jellemzően szombat 16:00-tól</div>')
          s=s.replace('Havi 1 alkalom, szombatonként 16:00-tól', 'Havi 1 alkalom, jellemzően szombatonként 16:00-tól')
          s=s.replace('<div class="date">2026. szeptember 27.</div>', '<div class="date">2026. szeptember 27. · vasárnap</div>')
          s=s.replace('"description":"Havi gyermekfoglalkozások Bécsben 6–14 éveseknek: magyar mondák, népi ritmusok, dobolás, mozgás és kézművesség."', '"description":"Havi gyermekfoglalkozások Bécsben 6–14 éveseknek: magyar mondák, népi ritmusok, dobolás, mozgás és kézművesség. Az alkalmak jellemzően szombatonként 16:00-kor kezdődnek; az első bemutató alkalom 2026. szeptember 27-én, vasárnap lesz."')
          p.write_text(s,encoding='utf-8')

          p=Path('jelentkezes.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Havi egy alkalom, szombatonként 16:00-tól, 20 EUR / gyermek / alkalom.', 'Havi egy alkalom, jellemzően szombatonként 16:00-tól; az első bemutató alkalom 2026. szeptember 27-én, vasárnap lesz. 20 EUR / gyermek / alkalom.')
          s=s.replace('Havi egy szombati foglalkozás 16:00-tól, 6–14 éves gyerekeknek Bécsben.', 'Havi egy foglalkozás 6–14 éves gyerekeknek Bécsben, jellemzően szombatonként 16:00-tól; az első alkalom 2026. szeptember 27-én, vasárnap lesz.')
          s=s.replace('Havi egy alkalommal, szombatonként 16:00-tól találkozunk.', 'Havi egy alkalommal, jellemzően szombatonként 16:00-tól találkozunk. Az első, bemutató alkalom kivételesen 2026. szeptember 27-én, vasárnap lesz.')
          s=s.replace('havi 1 alkalom, szombatonként 16:00-tól', 'havi 1 alkalom, jellemzően szombatonként 16:00-tól')
          s=s.replace('Havi 1 alkalom, szombatonként 16:00-tól', 'Havi 1 alkalom, jellemzően szombatonként 16:00-tól')
          s=s.replace('A foglalkozások havi egy alkalommal, szombatonként 16:00-tól zajlanak.', 'A foglalkozások havi egy alkalommal, jellemzően szombatonként 16:00-tól zajlanak. Az első, bemutató alkalom kivételesen 2026. szeptember 27-én, vasárnap lesz.')
          p.write_text(s,encoding='utf-8')

          p=Path('llms.txt')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('szombatonként 16:00', 'jellemzően szombatonként 16:00')
              if '2026. szeptember 27' in s and 'vasárnap' not in s:
                  s=s.replace('2026. szeptember 27', '2026. szeptember 27. (vasárnap, bemutató alkalom)')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jelentkezes.html llms.txt
          git diff --cached --quiet && exit 0
          git commit -m "Clarify Sunday first session and regular Saturday schedule"
          git push