name: Entity SEO and hero cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/seo-entity-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage and registration metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Világfa Sárkányai — Gyermek Dobcsapat | Bécsi Magyar Iskola</title>','<title>Magyar gyermek dobcsapat Bécsben | Világfa Sárkányai</title>')
          s=s.replace('<meta name="description" content="A Világfa Sárkányai gyermek dobcsapat 6–14 éves gyerekeknek nyújt játékos, élményalapú utat a magyar néphagyományba — közös dobolással, népi ritmusokkal és a táltos-világ meséivel.">','<meta name="description" content="Világfa Sárkányai: magyar gyermek dobcsapat Bécsben 6–14 éveseknek. Havi alkalmak 16:00-kor, népi ritmusokkal, mondákkal, mozgással és kézművességgel. 20 EUR / gyermek / alkalom.">')
          s=s.replace('<meta name="robots" content="index, follow, max-image-preview:large">','<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">\n<meta name="theme-color" content="#17251a">\n<link rel="sitemap" type="application/xml" href="https://taltosdob.magyariskola.at/sitemap.xml">')
          s=s.replace('<meta property="og:title" content="Világfa Sárkányai — Gyermek Dobcsapat | Bécsi Magyar Iskola">','<meta property="og:title" content="Magyar gyermek dobcsapat Bécsben | Világfa Sárkányai">')
          s=s.replace('<meta property="og:description" content="Játékos, élményalapú út a magyar néphagyományba 6–14 éves gyerekeknek Bécsben.">','<meta property="og:description" content="Magyar gyermek dobcsapat Bécsben 6–14 éveseknek: ritmus, monda, közösség és kézművesség. Havi alkalmak 16:00-kor.">')
          if 'og:image:alt' not in s:
              s=s.replace('<meta property="og:image" content="https://taltosdob.magyariskola.at/images/social-share.jpg">','<meta property="og:image" content="https://taltosdob.magyariskola.at/images/social-share.jpg">\n<meta property="og:image:alt" content="Világfa Sárkányai magyar gyermek dobcsapat Bécsben">')

          s=s.replace('.hero-pills{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:26px auto 0}.hero-pill{padding:8px 13px;border-radius:999px;border:1px solid rgba(227,199,124,.28);background:rgba(255,255,255,.045);color:#e6dfd0;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase}', '.hero-pills{display:flex;justify-content:center;align-items:center;gap:0;flex-wrap:wrap;margin:26px auto 0}.hero-pill{padding:4px 10px;color:#d9d2c2;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase}.hero-pill:not(:last-child)::after{content:"·";margin-left:20px;color:var(--gold);opacity:.8}')

          schema='''<script type="application/ld+json">{
          "@context":"https://schema.org",
          "@graph":[
            {"@type":"WebSite","@id":"https://taltosdob.magyariskola.at/#website","url":"https://taltosdob.magyariskola.at/","name":"Világfa Sárkányai — Gyermek Dobcsapat","inLanguage":"hu-HU"},
            {"@type":"WebPage","@id":"https://taltosdob.magyariskola.at/#webpage","url":"https://taltosdob.magyariskola.at/","name":"Magyar gyermek dobcsapat Bécsben | Világfa Sárkányai","isPartOf":{"@id":"https://taltosdob.magyariskola.at/#website"},"mainEntity":{"@id":"https://taltosdob.magyariskola.at/#event-series"},"inLanguage":"hu-HU"},
            {"@type":"Organization","@id":"https://taltosdob.magyariskola.at/#program","name":"Világfa Sárkányai Gyermek Dobcsapat","alternateName":"Világfa Sárkányai Táltosdob Csapat","url":"https://taltosdob.magyariskola.at/","logo":"https://taltosdob.magyariskola.at/images/logo.svg","description":"A Regélő Fehér Táltos Hagyományőrző Egyesület bécsi gyerek dobcsapata és a Bécsi Magyar Iskola közös programja 6–14 éves gyermekeknek.","knowsAbout":["magyar néphagyomány","népi ritmusok","közös dobolás","magyar mondák","rovásírás","kézművesség"],"areaServed":{"@type":"City","name":"Wien","alternateName":"Bécs"},"location":{"@id":"https://taltosdob.magyariskola.at/#venue"},"contactPoint":{"@type":"ContactPoint","contactType":"program information","name":"Hupczik Andrea","email":"hupczik@gmail.com","telephone":"+436706539011","availableLanguage":["hu","de"]},"sameAs":["https://www.taltosdob.hu","https://www.facebook.com/taltosdob","https://open.spotify.com/artist/6OJS2Y2KntijVTQWhIv0bo"]},
            {"@type":"EducationalOrganization","@id":"https://taltosdob.magyariskola.at/#school","name":"Bécsi Magyar Iskola","url":"https://www.magyariskola.at","email":"office@magyariskola.at"},
            {"@type":"Organization","@id":"https://taltosdob.magyariskola.at/#taltos","name":"Regélő Fehér Táltos Hagyományőrző Egyesület","url":"https://www.taltosdob.hu","email":"taltosdob@gmail.com"},
            {"@type":"Person","@id":"https://taltosdob.magyariskola.at/#hupczik-andrea","name":"Hupczik Andrea","jobTitle":"Szakmai vezető — foglalkozásvezető","email":"hupczik@gmail.com","telephone":"+436706539011"},
            {"@type":"Place","@id":"https://taltosdob.magyariskola.at/#venue","name":"Bécsi Magyar Iskola — Schwedenplatz","address":{"@type":"PostalAddress","streetAddress":"Schwedenplatz 2 / Laurenzerberg 5","addressLocality":"Wien","postalCode":"1010","addressCountry":"AT"}},
            {"@type":"EventSeries","@id":"https://taltosdob.magyariskola.at/#event-series","name":"Világfa Sárkányai — 2026/2027-es gyermek dobcsapat","description":"Havi gyermekfoglalkozások Bécsben 6–14 éveseknek: magyar mondák, népi ritmusok, dobolás, mozgás és kézművesség.","url":"https://taltosdob.magyariskola.at/#program","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","location":{"@id":"https://taltosdob.magyariskola.at/#venue"},"organizer":[{"@id":"https://taltosdob.magyariskola.at/#taltos"},{"@id":"https://taltosdob.magyariskola.at/#school"}],"performer":{"@id":"https://taltosdob.magyariskola.at/#hupczik-andrea"},"audience":{"@type":"PeopleAudience","suggestedMinAge":6,"suggestedMaxAge":14},"offers":{"@type":"Offer","price":"20","priceCurrency":"EUR","url":"https://taltosdob.magyariskola.at/jelentkezes.html","availability":"https://schema.org/InStock"},"subEvent":[
              {"@type":"Event","name":"Bemutató óra — A magyarok eredete","startDate":"2026-09-27T16:00:00+02:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"Hunor és Magor","startDate":"2026-10-24T16:00:00+02:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"Kerecseny — a fény születése","startDate":"2026-11-28T16:00:00+01:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"Attila és a hun hagyomány","startDate":"2027-01-16T16:00:00+01:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"Emese álma és Álmos születése","startDate":"2027-02-13T16:00:00+01:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"Vérszerződés és Árpád","startDate":"2027-03-13T16:00:00+01:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"A honfoglalás","startDate":"2027-04-17T16:00:00+02:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}},
              {"@type":"Event","name":"Gyakorlás","startDate":"2027-05-22T16:00:00+02:00","location":{"@id":"https://taltosdob.magyariskola.at/#venue"}}
            ]}
          ]}</script>'''
          s=re.sub(r'<script type="application/ld\+json">.*?</script>',schema,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')

          p=Path('jelentkezes.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<meta name="robots" content="index, follow">','<meta name="robots" content="index, follow, max-snippet:-1">\n<link rel="sitemap" type="application/xml" href="https://taltosdob.magyariskola.at/sitemap.xml">')
          if 'RegisterAction' not in s:
              s=s.replace('</head>','<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","url":"https://taltosdob.magyariskola.at/jelentkezes.html","name":"Jelentkezés | Világfa Sárkányai gyermek dobcsapat Bécs","about":{"@id":"https://taltosdob.magyariskola.at/#event-series"},"potentialAction":{"@type":"RegisterAction","target":"https://taltosdob.magyariskola.at/jelentkezes.html"},"inLanguage":"hu-HU"}</script>\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JSON-LD
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          for f in ['index.html','jelentkezes.html']:
              s=Path(f).read_text(encoding='utf-8')
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>',s,re.S): json.loads(block)
          print('JSON-LD valid')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jelentkezes.html
          git diff --cached --quiet && exit 0
          git commit -m "Clean hero labels and add entity-first SEO schema"
          git push
