name: Replace oromzene photo
on:
  push:
    paths:
      - '.github/workflows/replace-oromzene-photo.yml'
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: cp images/andrea-family-final-2026.jpg images/andrea-oromzene-final-2026.jpg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/andrea-oromzene-final-2026.jpg
          git diff --cached --quiet || git commit -m "Replace oromzene photo with Andrea supplied image"
          git push
