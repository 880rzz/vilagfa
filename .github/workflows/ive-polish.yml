name: One-shot authentic design polish

on:
  push:
    paths:
      - '.github/workflows/ive-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply supplied logos and design polish
        run: python3 scripts/ive_polish.py
      - name: Commit polished site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jelentkezes.html adatvedelem.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Polish authentic one-page design and use supplied logos"
          git push origin HEAD:main
