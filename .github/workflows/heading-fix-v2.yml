name: Heading fix v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/heading-fix-v2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: echo 'body .hero h1{font-size:clamp(2.65rem,5.2vw,4.9rem)!important;line-height:.98!important}body .copy h2{font-size:clamp(1.95rem,3vw,2.95rem)!important;line-height:1.06!important}body .section-head h2{font-size:clamp(2rem,3.15vw,3.05rem)!important;line-height:1.06!important}body .footer h2{font-size:clamp(2rem,3.35vw,3.2rem)!important;line-height:1.05!important}body .form-hero h1{font-size:clamp(2.35rem,4.5vw,4.25rem)!important;line-height:1!important}@media(max-width:640px){body .hero h1{font-size:clamp(2.35rem,10vw,3.15rem)!important}body .copy h2,body .section-head h2{font-size:clamp(1.85rem,8vw,2.45rem)!important}body .footer h2{font-size:clamp(1.95rem,8.5vw,2.6rem)!important}body .form-hero h1{font-size:clamp(2.1rem,9vw,2.9rem)!important}}' >> apple-layout.css
      - run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add apple-layout.css && git commit -m 'Reduce H1 and H2 typography scale' && git push origin HEAD:main
