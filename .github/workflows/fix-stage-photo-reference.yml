name: Fix stage photo reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stage-photo-reference.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace broken image reference
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'images/andrea-stage-2-final-2026.jpg'
          new = 'images/andrea-stage-2-2026.jpg?v=20260829-3'
          if old not in s:
              raise SystemExit('Target image reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix broken stage photo reference'
          git push origin HEAD:main
