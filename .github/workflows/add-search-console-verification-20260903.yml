name: Add Search Console verification
on:
  push:
    paths:
      - '.github/workflows/add-search-console-verification-20260903.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Google verification meta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<meta name="google-site-verification" content="GLEJaRDpWmedVe42TtTSglzgk9Med4gsX2mjSRhfOqk" />'
          if tag not in s:
              marker='<meta name="viewport" content="width=device-width, initial-scale=1.0">'
              if marker not in s:
                  raise SystemExit('viewport marker not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit verification meta
        run: |
          git config user.name "BMI SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Google Search Console verification"
          git push
